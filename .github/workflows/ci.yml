name: CI

on:
  push:
    branches: [main, develop, "feature/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  id-token: write        # For cosign keyless signing (main branch only)
  packages: write        # For GHCR push (main branch only)
  security-events: write # For code scanning results

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Frontend build and lint
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci — fails if lock file out of sync)
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npm run type-check

      - name: Regression tests and lint
        working-directory: frontend
        run: |
          npm test
          npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: npm audit (fail on high/critical)
        working-directory: frontend
        run: npm audit --audit-level=high

  # ─────────────────────────────────────────────────────────────────────────
  # .NET build and unit tests
  # ─────────────────────────────────────────────────────────────────────────
  dotnet-build:
    name: .NET Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore (fail if lock files out of sync)
        run: dotnet restore --use-lock-file

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Run unit tests with coverage
        run: |
          dotnet test src/SecureVault.Tests/SecureVault.Tests.csproj \
            --no-build -c Release \
            --filter "Category!=Integration&Category!=Security" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage

      - name: Check coverage threshold (≥15%)
        run: |
          set -euo pipefail
          # Extract line coverage from coverage report
          COVERAGE=$(grep -oP 'line-rate="\K[^"]+' coverage/**/coverage.cobertura.xml | head -1)
          if [[ -z "$COVERAGE" ]]; then
            echo "Could not extract line coverage from coverage report — failing CI."
            ls -R coverage || true
            exit 1
          fi
          THRESHOLD="0.15"
          if awk "BEGIN {exit !($COVERAGE < $THRESHOLD)}"; then
            echo "Coverage ${COVERAGE} is below threshold ${THRESHOLD}"
            exit 1
          fi
          echo "Coverage: ${COVERAGE} (threshold: ${THRESHOLD})"

      - name: Check for vulnerable packages (fail on Critical/High)
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
          # dotnet list package doesn't exit non-zero by default — grep for issues
          if grep -qE "Critical|High" vuln-report.txt; then
            echo "Critical or High severity vulnerabilities found!"
            cat vuln-report.txt
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Integration and security tests (Testcontainers requires Docker)
  # ─────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration & Security Tests
    runs-on: ubuntu-latest
    needs: [dotnet-build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore --use-lock-file

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Run integration tests (real SQL Server via Testcontainers)
        run: |
          dotnet test src/SecureVault.Tests/SecureVault.Tests.csproj \
            --no-build -c Release \
            --filter "Category=Integration|Category=Security" \
            --results-directory ./test-results
        env:
          # Integration tests use Testcontainers — no real keys needed
          # Keys are generated ephemerally in test setup
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"

  # ─────────────────────────────────────────────────────────────────────────
  # Trivy filesystem security scan
  # ─────────────────────────────────────────────────────────────────────────
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy FS scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # ─────────────────────────────────────────────────────────────────────────
  # Publish artifact (main branch only): zipped .NET publish output + SPA.
  # The Windows Server install path consumes this artifact directly — no
  # production container image is built.
  # ─────────────────────────────────────────────────────────────────────────
  publish-artifact:
    name: Publish Release Artifact
    runs-on: ubuntu-latest
    needs: [frontend, dotnet-build, trivy-scan, integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Publish API (win-x64, self-contained=false)
        run: |
          dotnet publish src/SecureVault.Api/SecureVault.Api.csproj \
            -c Release -r win-x64 --no-self-contained \
            -o ./publish
          mkdir -p ./publish/wwwroot
          cp -r frontend/dist/* ./publish/wwwroot/

      - name: Zip release bundle
        run: |
          cd publish && zip -r ../securevault-${{ github.sha }}.zip . && cd ..

      - name: Upload as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: securevault-release
          path: securevault-${{ github.sha }}.zip
          retention-days: 30
